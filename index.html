<!DOCTYPE html>
<html lang="ur" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farman Kisan Hub – AI Zirai Assistant</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    /* ====================================================
       FARMAN KISAN HUB - ORIGINAL PREMIUM THEME & STYLES
       ==================================================== */
    :root {
      --bg-main: #f0fdf4;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #15803d;
      --primary-dark: #166534;
      --primary-light: #dcfce7;
      --border: #cbd5e1;
      --user-bubble: #16a34a;
      --ai-bubble: #ffffff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --primary-light: #14532d;
      --border: #334155;
      --user-bubble: #15803d;
      --ai-bubble: #1e293b;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR DESIGN --- */
    #sidebar {
      width: 290px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
    
    .sidebar-brand {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-light);
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-dark);
    }
    .brand-title i { font-size: 22px; color: var(--primary); }

    .sidebar-actions { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    
    .btn-new-chat {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-new-chat:hover { background-color: var(--primary-dark); }

    .search-box {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      font-size: 13.5px;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      transition: all 0.2s;
    }
    .history-item:hover, .history-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .history-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .history-item-icons i {
      font-size: 14px;
      color: var(--text-sub);
      margin-left: 6px;
      padding: 4px;
      border-radius: 4px;
    }
    .history-item-icons i:hover { color: #ef4444; }

    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
    }
    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* --- MAIN CHAT AREA --- */
    #mainContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-main);
    }

    .main-header {
      padding: 14px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--primary); }

    .chat-body-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message Rows & Bubbles */
    .msg-row { display: flex; gap: 12px; max-width: 82%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai { align-self: flex-start; }

    .msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .msg-row.user .msg-avatar { background: #3b82f6; }

    .msg-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      box-shadow: var(--shadow);
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border: none;
    }

    .msg-bubble h2, .msg-bubble h3 {
      color: var(--primary);
      margin: 10px 0 6px 0;
      font-size: 16px;
    }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 8px 0; }
    .msg-bubble strong { font-weight: 700; }

    /* Onboarding Screen (Blank Chat State) */
    .blank-welcome-card {
      text-align: center;
      max-width: 600px;
      margin: auto;
      padding: 30px;
    }
    .blank-welcome-card i { font-size: 54px; color: var(--primary); margin-bottom: 12px; }
    .faq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .faq-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13.5px;
      text-align: left;
      transition: all 0.2s;
    }
    .faq-card:hover { border-color: var(--primary); transform: translateY(-2px); }

    /* Photo Upload Preview Strip */
    .image-preview-strip {
      display: none;
      padding: 10px 20px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 12px;
    }
    .image-preview-strip.active { display: flex; }
    .image-preview-strip img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

    /* --- INPUT BAR AREA (VOICE BUTTON RIGHT NEXT TO SEND BUTTON) --- */
    .input-bar-container {
      padding: 16px 20px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .attach-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .chat-textarea {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 15px;
      max-height: 120px;
      resize: none;
      outline: none;
    }

    /* RIGHT SIDE CONTROLS: MIC BUTTON BILKUL SEND BUTTON KE SAATH */
    .right-input-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
    }
    .mic-btn.recording { background: #ef4444; color: #ffffff; animation: pulse 1s infinite; }

    .send-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      height: 44px;
      padding: 0 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .send-btn:hover { background: var(--primary-dark); }

    /* Modals & Toasts */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .custom-modal.active { display: flex; }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 14px;
      width: 90%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .modal-card h3 { color: var(--primary); margin-bottom: 14px; }
    .modal-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
    }

    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-main);
      color: var(--bg-surface);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      z-index: 9999;
    }
    .toast-msg.active { display: block; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title"><i class="bi bi-robot"></i> Farman Kisan Hub</div>
      <i class="bi bi-x-lg" style="cursor:pointer;" onclick="toggleSidebar()"></i>
    </div>

    <div class="sidebar-actions">
      <button class="btn-new-chat" onclick="startNewChat()"><i class="bi bi-plus-lg"></i> Nayi Chat</button>
      <input type="text" class="search-box" id="historySearch" placeholder="🔍 Purani chats khojein..." oninput="searchChats(this.value)">
    </div>

    <!-- Chat History List -->
    <div class="chat-history-list" id="chatHistoryList"></div>

    <div class="sidebar-footer">
      <div class="user-profile-btn" onclick="openProfileModal()">
        <i class="bi bi-person-circle" style="font-size:20px; color:var(--primary);"></i>
        <span id="navUserName">Kisan Account</span>
      </div>
      <i class="bi bi-gear" style="cursor:pointer; font-size:18px;" onclick="openProfileModal()"></i>
    </div>
  </div>

  <!-- MAIN CHAT CONTAINER -->
  <div id="mainContent">
    <!-- Header -->
    <div class="main-header">
      <div class="header-left">
        <button class="attach-btn" style="width:38px; height:38px;" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <span class="header-title">🌾 Farman Kisan Hub AI Saathi</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="attach-btn" style="width:38px; height:38px;" title="Change Theme" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body-container" id="chatContainer"></div>

    <!-- Image Attachment Preview Strip -->
    <div class="image-preview-strip" id="imagePreviewStrip">
      <img id="imgThumb" src="" alt="Crop Photo">
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:600;">Zirai Tasveer Attached</div>
        <div style="font-size:11px; color:var(--primary);" id="imgSizeBadge">Ready for analysis</div>
      </div>
      <i class="bi bi-trash" style="cursor:pointer; color:#ef4444; font-size:18px;" onclick="clearImageAttachment()"></i>
    </div>

    <!-- INPUT BAR (MIC BUTTON IS RIGHT NEXT TO SEND BUTTON) -->
    <div class="input-bar-container">
      <!-- Hidden File Upload -->
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/jpg" style="display:none;" onchange="handleImageSelect(event)">
      
      <!-- Left Attachment Icon -->
      <button class="attach-btn" title="Khet ya Fasal ki Tasveer Bejhein" onclick="document.getElementById('fileInput').click()">
        <i class="bi bi-paperclip"></i>
      </button>

      <!-- Multi-line Text Area Input -->
      <textarea id="chatInput" class="chat-textarea" placeholder="Apni fasal, keeday ya zameen ke bare mein sawal poochein..." rows="1"></textarea>

      <!-- RIGHT SIDE: MIC BUTTON AND SEND BUTTON (BILKUL SAATH SAATH) -->
      <div class="right-input-buttons">
        <button class="mic-btn" id="micBtn" title="Bol kar samjhane ke liye click karein" onclick="toggleVoiceInput()">
          <i class="bi bi-mic"></i>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          Bhejein <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Profile / Auth Modal -->
  <div class="custom-modal" id="profileModal">
    <div class="modal-card">
      <h3>👤 Kisan Profile & Account</h3>
      <input type="text" id="authPhoneInput" placeholder="Mobile Number (03001234567)">
      <input type="password" id="authPassInput" placeholder="Password (min 6 chars)">
      <input type="text" id="authNameInput" placeholder="Aapka Naam (Optional)">
      
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-new-chat" style="flex:1;" onclick="handleLogin()">Sign In</button>
        <button class="btn-new-chat" style="flex:1; background:#0284c7;" onclick="handleSignup()">Register</button>
      </div>
      <button class="btn-new-chat" style="width:100%; margin-top:10px; background:#ef4444;" onclick="handleLogout()">Sign Out</button>
      <button class="btn-new-chat" style="width:100%; margin-top:8px; background:var(--bg-card); color:var(--text-main);" onclick="closeModal('profileModal')">Band Karein</button>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div class="toast-msg" id="toastMsg"></div>

  <!-- ====================================================
       FRONTEND JAVASCRIPT LOGIC
       ==================================================== -->
  <script>
    const AUTH_TOKEN_KEY = "kisan_auth_token";
    let currentImageBase64 = null;
    let currentImageMime = null;
    let currentChatId = null;
    let messages = [];
    let isListening = false;

    // Toast Alert
    function showToast(msg) {
      const toast = document.getElementById("toastMsg");
      toast.textContent = msg;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3500);
    }

    // Toggle Theme
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("kisan_theme", next);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }
    function openProfileModal() {
      document.getElementById("profileModal").classList.add("active");
    }

    // Attachment Image Convert
    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { showToast("Tasveer 10MB se choti honi chahiye."); return; }

      const reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result.split(',')[1];
        currentImageMime = file.type;

        document.getElementById("imgThumb").src = evt.target.result;
        document.getElementById("imgSizeBadge").textContent = (file.size/1024).toFixed(1) + " KB Attached";
        document.getElementById("imagePreviewStrip").classList.add("active");
      };
      reader.readAsDataURL(file);
    }

    function clearImageAttachment() {
      currentImageBase64 = null;
      currentImageMime = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("imagePreviewStrip").classList.remove("active");
    }

    // Voice Input Speech Recognition
    function toggleVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast("Aapke browser mein voice recognition supported nahi hai.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        document.getElementById("micBtn").classList.add("recording");
      };

      recognition.onresult = function(e) {
        document.getElementById("chatInput").value += " " + e.results[0][0].transcript;
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById("micBtn").classList.remove("recording");
      };

      recognition.start();
    }

    // Response Markdown Formatting
    function formatMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\- (.*$)/gim, '<li style="margin-left:15px;">$1</li>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    // Append Message to Screen
    function appendMessage(role, text, imageSrc = null) {
      const container = document.getElementById("chatContainer");
      const row = document.createElement("div");
      row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

      const avatarIcon = role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-robot"></i>';
      const imgHTML = imageSrc ? `<img src="${imageSrc}" style="max-width:220px; border-radius:8px; margin-bottom:8px; display:block;">` : '';

      row.innerHTML = `
        <div class="msg-avatar">${avatarIcon}</div>
        <div class="msg-bubble">${imgHTML}${formatMarkdown(text)}</div>
      `;

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // Show Blank Onboarding Screen
    function renderBlankOnboarding() {
      const container = document.getElementById("chatContainer");
      container.innerHTML = `
        <div class="blank-welcome-card">
          <i class="bi bi-flower1"></i>
          <h2>Farman Kisan Hub AI Saathi</h2>
          <p style="color:var(--text-sub); margin-top:6px;">Apni fasal ki bimari, keeday, khad ya zameen ki tasveer bhej kar immediate mashwara hasil karein.</p>
          <div class="faq-grid">
            <div class="faq-card" onclick="sendFAQPrompt('Gandum mein pehli khad kab deni chahiye?')">🌾 Gandum ki pehli khad kab deni chahiye?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Kapas ki Gulabi Sundi ka ilaj kya hai?')">🐛 Kapas ki Gulabi Sundi ka sasta ilaj?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Kalar wali zameen ke liye Gypsum ki miqdar?')">🧪 Zameen ke Kalar ke liye Gypsum ki miqdar?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Dhan mein paani ki bachat ka tareeqah?')">💧 Dhan mein paani ki bachat ka tareeqah?</div>
          </div>
        </div>
      `;
    }

    function sendFAQPrompt(text) {
      document.getElementById("chatInput").value = text;
      sendMessage();
    }

    // Main Send Message Function
    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text && !currentImageBase64) return;

      // Clear blank onboarding if first msg
      if (messages.length === 0) {
        document.getElementById("chatContainer").innerHTML = "";
      }

      if (!currentChatId) currentChatId = "chat_" + Date.now();

      const userImageSrc = currentImageBase64 ? `data:${currentImageMime};base64,${currentImageBase64}` : null;
      appendMessage('user', text || "Crop photo uploaded...", userImageSrc);

      messages.push({ role: 'user', content: text || "Please analyze this crop image." });

      const payload = {
        messages: messages,
        image: currentImageBase64 ? { mimeType: currentImageMime, data: currentImageBase64 } : null
      };

      input.value = "";
      clearImageAttachment();

      // Typing Dot
      const loadingRow = document.createElement("div");
      loadingRow.className = "msg-row ai";
      loadingRow.innerHTML = `<div class="msg-avatar"><i class="bi bi-robot"></i></div><div class="msg-bubble">⏳ AI Tashkhees kar raha hai...</div>`;
      document.getElementById("chatContainer").appendChild(loadingRow);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const reply = data.reply || "Jawab nahi mil saka. Dobara try karein.";

        loadingRow.remove();
        appendMessage('assistant', reply);
        messages.push({ role: 'assistant', content: reply });

        // Save Chat to Database
        saveChatToDatabase();
      } catch (err) {
        loadingRow.remove();
        appendMessage('assistant', "Network Error: Internet connection check karein.");
      }
    }

    // Save Chat to Cloud API
    async function saveChatToDatabase() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token || !currentChatId) return;

      const title = messages.find(m => m.role === 'user')?.content.slice(0, 30) || "Zirai Mashwara";
      try {
        await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({
            action: "save",
            chat: { id: currentChatId, title: title, messages: messages }
          })
        });
        fetchUserCloudHistory();
      } catch (e) {}
    }

    // Fetch User Cloud History
    async function fetchUserCloudHistory() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) {
        document.getElementById("chatHistoryList").innerHTML = `<div style="text-align:center; padding:20px; font-size:12px; opacity:0.6;">Sign in to view history</div>`;
        return;
      }

      try {
        const res = await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "list" })
        });
        const data = await res.json();
        if (data.ok && Array.isArray(data.chats)) {
          renderHistoryList(data.chats);
        }
      } catch (e) {}
    }

    function renderHistoryList(chats) {
      const listEl = document.getElementById("chatHistoryList");
      if (!chats || chats.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:15px; font-size:12px; opacity:0.6;">Koi purani chat nahi mili</div>`;
        return;
      }

      listEl.innerHTML = chats.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChatById('${c.id}')">
          <span class="history-item-title">${c.title}</span>
          <div class="history-item-icons">
            <i class="bi bi-trash" title="Delete" onclick="deleteChatPermanently(event, '${c.id}')"></i>
          </div>
        </div>
      `).join("");
    }

    async function loadChatById(chatId) {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;

      const res = await fetch("/api/history", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ action: "list" })
      });
      const data = await res.json();
      if (data.ok && Array.isArray(data.chats)) {
        const target = data.chats.find(c => c.id === chatId);
        if (target) {
          currentChatId = target.id;
          messages = target.messages || [];
          document.getElementById("chatContainer").innerHTML = "";
          messages.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
        }
      }
    }

    async function deleteChatPermanently(event, chatId) {
      event.stopPropagation();
      if (!confirm("Kya aap ye chat permanently delete karna chahte hain?")) return;

      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      try {
        await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "delete", id: chatId })
        });
        showToast("Chat permanently delete ho gayi!");
        if (currentChatId === chatId) startNewChat();
        else fetchUserCloudHistory();
      } catch (e) {}
    }

    function searchChats(query) {
      const items = document.querySelectorAll(".history-item");
      items.forEach(item => {
        const txt = item.textContent.toLowerCase();
        item.style.display = txt.includes(query.toLowerCase()) ? "flex" : "none";
      });
    }

    function startNewChat() {
      messages = [];
      currentChatId = null;
      renderBlankOnboarding();
    }

    // AUTH HANDLERS
    async function handleLogin() {
      const phone = document.getElementById("authPhoneInput").value.trim();
      const password = document.getElementById("authPassInput").value.trim();
      if (!phone || !password) { showToast("Mobile number aur password darj karein."); return; }

      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", phone, password })
      });
      const data = await res.json();
      if (data.ok && data.token) {
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
        showToast("Signed in successfully!");
        closeModal("profileModal");
        fetchUserCloudHistory();
      } else {
        showToast("Error: " + (data.error || "Login fail"));
      }
    }

    async function handleSignup() {
      const phone = document.getElementById("authPhoneInput").value.trim();
      const password = document.getElementById("authPassInput").value.trim();
      const name = document.getElementById("authNameInput").value.trim();

      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "signup", phone, password, name })
      });
      const data = await res.json();
      if (data.ok && data.token) {
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
        showToast("Account created successfully!");
        closeModal("profileModal");
        fetchUserCloudHistory();
      } else {
        showToast("Error: " + (data.error || "Signup fail"));
      }
    }

    function handleLogout() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      document.getElementById("navUserName").textContent = "Kisan Account";
      showToast("Signed out!");
      closeModal("profileModal");
      startNewChat();
      fetchUserCloudHistory();
    }

    // Auto Restore Session on Load
    async function checkAutoSession() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;

      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "me" })
        });
        const data = await res.json();
        if (data.ok && data.user) {
          document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
          fetchUserCloudHistory();
        }
      } catch (e) {}
    }

    // Multi-line Textarea Keydown
    document.getElementById("chatInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Page Load Init
    document.addEventListener("DOMContentLoaded", function() {
      const savedTheme = localStorage.getItem("kisan_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      
      startNewChat();
      checkAutoSession();
    });
  </script>
</body>
</html>
