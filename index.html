<!DOCTYPE html>
<html lang="ur" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farman Kisan Hub – Pro AI Advisory</title>
  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* ====================================================
       FARMAN KISAN HUB - EXTRA PROFESSIONAL PRO THEME
       ==================================================== */
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: rgba(241, 245, 249, 0.8);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --primary: #059669;
      --primary-dark: #047857;
      --primary-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --border: #e2e8f0;
      --user-bubble: linear-gradient(135deg, #059669 0%, #047857 100%);
      --ai-bubble: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
      --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.85);
    }

    [data-theme="dark"] {
      --bg-main: #090d16;
      --bg-surface: #111827;
      --bg-card: rgba(31, 41, 55, 0.7);
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-gradient: linear-gradient(135deg, #34d399 0%, #059669 100%);
      --border: #1f2937;
      --user-bubble: linear-gradient(135deg, #059669 0%, #047857 100%);
      --ai-bubble: #111827;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 12px 30px -5px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.25);
      --glass-bg: rgba(17, 24, 39, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* --- SLEEK SIDEBAR --- */
    #sidebar {
      width: 300px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }
    #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

    .sidebar-brand {
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }
    .brand-title i {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 24px;
    }

    .sidebar-actions { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }

    .btn-new-chat {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      padding: 13px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-glow);
      transition: all 0.2s ease;
    }
    .btn-new-chat:hover { transform: translateY(-1px); filter: brightness(1.1); }

    .search-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      font-size: 13.5px;
      transition: border 0.2s;
    }
    .search-box:focus { border-color: var(--primary); }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      padding: 11px 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }
    .history-item:hover, .history-item.active {
      background: var(--bg-card);
      color: var(--text-main);
      border-color: var(--border);
    }
    .history-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .history-item-icons i {
      font-size: 14px;
      color: var(--text-sub);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .history-item:hover .history-item-icons i { opacity: 1; }
    .history-item-icons i:hover { color: #ef4444; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
    }
    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* --- EXECUTIVE MAIN CHAT AREA --- */
    #mainContent {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-main);
      position: relative;
    }

    .main-header {
      padding: 16px 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text-main); }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chat-body-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Message Rows & Glass Bubbles */
    .msg-row { display: flex; gap: 14px; max-width: 80%; animation: fadeIn 0.3s ease-out; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai { align-self: flex-start; }

    .msg-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .msg-row.user .msg-avatar { background: var(--text-main); color: var(--bg-main); border: none; }

    .msg-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.65;
      box-shadow: var(--shadow-md);
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border: none;
      box-shadow: var(--shadow-glow);
    }

    .msg-bubble h2, .msg-bubble h3 {
      color: var(--primary);
      margin: 14px 0 8px 0;
      font-size: 16.5px;
      font-weight: 700;
    }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 10px 0; }
    .msg-bubble strong { font-weight: 700; }

    /* Onboarding Hero Welcome Screen */
    .blank-welcome-card {
      text-align: center;
      max-width: 680px;
      margin: auto;
      padding: 40px 20px;
    }
    .hero-icon {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: var(--primary-gradient);
      color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      margin: 0 auto 20px auto;
      box-shadow: var(--shadow-glow);
    }
    .blank-welcome-card h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .blank-welcome-card p { color: var(--text-sub); font-size: 15px; max-width: 520px; margin: 0 auto 30px auto; }

    .faq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .faq-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .faq-card i { font-size: 20px; color: var(--primary); }
    .faq-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-md); }

    /* Photo Upload Preview Bar */
    .image-preview-strip {
      display: none;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 14px;
    }
    .image-preview-strip.active { display: flex; }
    .image-preview-strip img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }

    /* --- FLOATING MODERN INPUT BAR --- */
    .input-bar-container {
      padding: 20px 28px 24px 28px;
      background: transparent;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .input-dock {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 12px 8px 16px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s;
    }
    .input-dock:focus-within { border-color: var(--primary); box-shadow: var(--shadow-glow); }

    .attach-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: color 0.2s;
    }
    .attach-btn:hover { color: var(--primary); }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 500;
      max-height: 120px;
      padding: 8px 0;
      resize: none;
      outline: none;
    }

    /* RIGHT SIDE INPUT CONTROLS: MIC BUTTON RIGHT NEXT TO SEND BUTTON */
    .right-input-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }
    .mic-btn:hover { color: var(--primary); border-color: var(--primary); }
    .mic-btn.recording { background: #ef4444; color: #ffffff; border-color: #ef4444; animation: pulse 1s infinite; }

    .send-btn {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      height: 40px;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-glow);
      transition: transform 0.2s;
    }
    .send-btn:hover { transform: scale(1.02); }

    /* Custom Modals & Toasts */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .custom-modal.active { display: flex; }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 28px;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      box-shadow: var(--shadow-md);
    }
    .modal-card h3 { color: var(--text-main); font-size: 20px; font-weight: 800; margin-bottom: 16px; }
    .modal-card input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .toast-msg {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--text-main);
      color: var(--bg-surface);
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
      z-index: 9999;
      box-shadow: var(--shadow-md);
    }
    .toast-msg.active { display: block; animation: slideUp 0.3s ease-out; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- SLEEK SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title"><i class="bi bi-cpu-fill"></i> Kisan Hub Pro</div>
      <i class="bi bi-x-lg" style="cursor:pointer; color:var(--text-sub);" onclick="toggleSidebar()"></i>
    </div>

    <div class="sidebar-actions">
      <button class="btn-new-chat" onclick="startNewChat()"><i class="bi bi-plus-lg"></i> Nayi Chat</button>
      <input type="text" class="search-box" id="historySearch" placeholder="🔍 Search chat history..." oninput="searchChats(this.value)">
    </div>

    <!-- Chat History List -->
    <div class="chat-history-list" id="chatHistoryList"></div>

    <div class="sidebar-footer">
      <div class="user-profile-btn" onclick="openProfileModal()">
        <i class="bi bi-person-circle" style="font-size:22px; color:var(--primary);"></i>
        <span id="navUserName">Kisan Account</span>
      </div>
      <i class="bi bi-sliders" style="cursor:pointer; font-size:18px; color:var(--text-sub);" onclick="openProfileModal()"></i>
    </div>
  </div>

  <!-- EXECUTIVE MAIN CONTENT -->
  <div id="mainContent">
    <!-- Header -->
    <div class="main-header">
      <div class="header-left">
        <button class="attach-btn" onclick="toggleSidebar()"><i class="bi bi-layout-sidebar"></i></button>
        <span class="header-title">Farman Kisan Hub AI</span>
        <span class="status-pill">Engine Pro 3.5</span>
      </div>
      <div>
        <button class="attach-btn" title="Toggle Dark/Light Mode" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body-container" id="chatContainer"></div>

    <!-- Photo Upload Preview Strip -->
    <div class="image-preview-strip" id="imagePreviewStrip">
      <img id="imgThumb" src="" alt="Crop Photo">
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:700;">Zirai Tasveer Attached</div>
        <div style="font-size:11px; color:var(--primary); font-weight:600;" id="imgSizeBadge">Ready for analysis</div>
      </div>
      <i class="bi bi-trash3" style="cursor:pointer; color:#ef4444; font-size:18px;" onclick="clearImageAttachment()"></i>
    </div>

    <!-- FLOATING DOCK INPUT BAR -->
    <div class="input-bar-container">
      <div class="input-dock">
        <!-- Hidden File Upload -->
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/jpg" style="display:none;" onchange="handleImageSelect(event)">
        
        <button class="attach-btn" title="Fasal ki Tasveer Attach Karein" onclick="document.getElementById('fileInput').click()">
          <i class="bi bi-paperclip"></i>
        </button>

        <textarea id="chatInput" class="chat-textarea" placeholder="Apni fasal, bimari ya zameen ke baare mein poochein..." rows="1"></textarea>

        <!-- RIGHT SIDE: MIC BUTTON AND SEND BUTTON (BILKUL SAATH SAATH) -->
        <div class="right-input-buttons">
          <button class="mic-btn" id="micBtn" title="Bol kar samjhane ke liye click karein" onclick="toggleVoiceInput()">
            <i class="bi bi-mic"></i>
          </button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            Send <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile & Account Modal -->
  <div class="custom-modal" id="profileModal">
    <div class="modal-card">
      <h3>👤 Account & Settings</h3>
      <input type="text" id="authPhoneInput" placeholder="Mobile Number (e.g. 03001234567)">
      <input type="password" id="authPassInput" placeholder="Password (min 6 chars)">
      <input type="text" id="authNameInput" placeholder="Aapka Naam (Optional)">
      
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn-new-chat" style="flex:1;" onclick="handleLogin()">Sign In</button>
        <button class="btn-new-chat" style="flex:1; background:#0284c7;" onclick="handleSignup()">Register</button>
      </div>
      <button class="btn-new-chat" style="width:100%; margin-top:10px; background:#ef4444;" onclick="handleLogout()">Sign Out</button>
      <button class="btn-new-chat" style="width:100%; margin-top:8px; background:var(--bg-card); color:var(--text-main); border:1px solid var(--border);" onclick="closeModal('profileModal')">Close</button>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg"></div>

  <!-- ====================================================
       FRONTEND LOGIC
       ==================================================== -->
  <script>
    const AUTH_TOKEN_KEY = "kisan_auth_token";
    let currentImageBase64 = null;
    let currentImageMime = null;
    let currentChatId = null;
    let messages = [];
    let isListening = false;

    function showToast(msg) {
      const toast = document.getElementById("toastMsg");
      toast.textContent = msg;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3500);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("kisan_theme", next);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
    }

    function closeModal(id) { document.getElementById(id).classList.remove("active"); }
    function openProfileModal() { document.getElementById("profileModal").classList.add("active"); }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { showToast("Image 10MB se choti honi chahiye."); return; }

      const reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result.split(',')[1];
        currentImageMime = file.type;

        document.getElementById("imgThumb").src = evt.target.result;
        document.getElementById("imgSizeBadge").textContent = (file.size/1024).toFixed(1) + " KB Attached";
        document.getElementById("imagePreviewStrip").classList.add("active");
      };
      reader.readAsDataURL(file);
    }

    function clearImageAttachment() {
      currentImageBase64 = null;
      currentImageMime = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("imagePreviewStrip").classList.remove("active");
    }

    function toggleVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast("Voice recognition supported nahi hai.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        document.getElementById("micBtn").classList.add("recording");
      };

      recognition.onresult = function(e) {
        document.getElementById("chatInput").value += " " + e.results[0][0].transcript;
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById("micBtn").classList.remove("recording");
      };

      recognition.start();
    }

    function formatMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\- (.*$)/gim, '<li style="margin-left:16px;">$1</li>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    function appendMessage(role, text, imageSrc = null) {
      const container = document.getElementById("chatContainer");
      const row = document.createElement("div");
      row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

      const avatarIcon = role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-cpu-fill"></i>';
      const imgHTML = imageSrc ? `<img src="${imageSrc}" style="max-width:220px; border-radius:10px; margin-bottom:10px; display:block;">` : '';

      row.innerHTML = `
        <div class="msg-avatar">${avatarIcon}</div>
        <div class="msg-bubble">${imgHTML}${formatMarkdown(text)}</div>
      `;

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function renderBlankOnboarding() {
      const container = document.getElementById("chatContainer");
      container.innerHTML = `
        <div class="blank-welcome-card">
          <div class="hero-icon"><i class="bi bi-flower1"></i></div>
          <h2>Farman Kisan Hub AI Pro</h2>
          <p>Apni fasal, bimari, khad ya zameen ki photo bhej kar instant AI diagnostic report hasil karein.</p>
          <div class="faq-grid">
            <div class="faq-card" onclick="sendFAQPrompt('Gandum ki pehli khad kab aur kitni deni chahiye?')"><i class="bi bi-patch-question"></i> Gandum ki pehli khad ka sahi waqt?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Kapas ki Gulabi Sundi ka sasta ilaj kya hai?')"><i class="bi bi-bug"></i> Kapas ki Gulabi Sundi ka ilaj?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Zameen ke kalar ke liye Gypsum ki miqdar?')"><i class="bi bi-moisture"></i> Zameen ke Kalar ke liye Gypsum?</div>
            <div class="faq-card" onclick="sendFAQPrompt('Dhan mein paani ki bachat ka tareeqah?')"><i class="bi bi-droplet"></i> Dhan mein paani bachat ka tareeqah?</div>
          </div>
        </div>
      `;
    }

    function sendFAQPrompt(text) {
      document.getElementById("chatInput").value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text && !currentImageBase64) return;

      if (messages.length === 0) document.getElementById("chatContainer").innerHTML = "";
      if (!currentChatId) currentChatId = "chat_" + Date.now();

      const userImageSrc = currentImageBase64 ? `data:${currentImageMime};base64,${currentImageBase64}` : null;
      appendMessage('user', text || "Photo attached for analysis...", userImageSrc);

      messages.push({ role: 'user', content: text || "Please analyze this attached crop photo." });

      const payload = {
        messages: messages,
        image: currentImageBase64 ? { mimeType: currentImageMime, data: currentImageBase64 } : null
      };

      input.value = "";
      clearImageAttachment();

      const loadingRow = document.createElement("div");
      loadingRow.className = "msg-row ai";
      loadingRow.innerHTML = `<div class="msg-avatar"><i class="bi bi-cpu-fill"></i></div><div class="msg-bubble">⚡ AI Diagnostic Report tayyar ho rahi hai...</div>`;
      document.getElementById("chatContainer").appendChild(loadingRow);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const reply = data.reply || "Unable to retrieve response.";

        loadingRow.remove();
        appendMessage('assistant', reply);
        messages.push({ role: 'assistant', content: reply });

        saveChatToDatabase();
      } catch (err) {
        loadingRow.remove();
        appendMessage('assistant', "Network Error: Please check your internet connection.");
      }
    }

    async function saveChatToDatabase() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token || !currentChatId) return;

      const title = messages.find(m => m.role === 'user')?.content.slice(0, 30) || "Zirai Mashwara";
      try {
        await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "save", chat: { id: currentChatId, title: title, messages: messages } })
        });
        fetchUserCloudHistory();
      } catch (e) {}
    }

    async function fetchUserCloudHistory() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) {
        document.getElementById("chatHistoryList").innerHTML = `<div style="text-align:center; padding:20px; font-size:12px; opacity:0.5;">Sign in to view history</div>`;
        return;
      }

      try {
        const res = await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "list" })
        });
        const data = await res.json();
        if (data.ok && Array.isArray(data.chats)) renderHistoryList(data.chats);
      } catch (e) {}
    }

    function renderHistoryList(chats) {
      const listEl = document.getElementById("chatHistoryList");
      if (!chats || chats.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:15px; font-size:12px; opacity:0.5;">Koi history nahi mili</div>`;
        return;
      }

      listEl.innerHTML = chats.map(c => `
        <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChatById('${c.id}')">
          <span class="history-item-title">${c.title}</span>
          <div class="history-item-icons">
            <i class="bi bi-trash3" title="Delete" onclick="deleteChatPermanently(event, '${c.id}')"></i>
          </div>
        </div>
      `).join("");
    }

    async function loadChatById(chatId) {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;

      const res = await fetch("/api/history", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ action: "list" })
      });
      const data = await res.json();
      if (data.ok && Array.isArray(data.chats)) {
        const target = data.chats.find(c => c.id === chatId);
        if (target) {
          currentChatId = target.id;
          messages = target.messages || [];
          document.getElementById("chatContainer").innerHTML = "";
          messages.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
        }
      }
    }

    async function deleteChatPermanently(event, chatId) {
      event.stopPropagation();
      if (!confirm("Permanently delete this chat?")) return;

      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      try {
        await fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "delete", id: chatId })
        });
        showToast("Chat permanently deleted!");
        if (currentChatId === chatId) startNewChat();
        else fetchUserCloudHistory();
      } catch (e) {}
    }

    function searchChats(query) {
      const items = document.querySelectorAll(".history-item");
      items.forEach(item => {
        const txt = item.textContent.toLowerCase();
        item.style.display = txt.includes(query.toLowerCase()) ? "flex" : "none";
      });
    }

    function startNewChat() {
      messages = [];
      currentChatId = null;
      renderBlankOnboarding();
    }

    async function handleLogin() {
      const phone = document.getElementById("authPhoneInput").value.trim();
      const password = document.getElementById("authPassInput").value.trim();
      if (!phone || !password) { showToast("Mobile number aur password darj karein."); return; }

      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", phone, password })
      });
      const data = await res.json();
      if (data.ok && data.token) {
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
        showToast("Signed in successfully!");
        closeModal("profileModal");
        fetchUserCloudHistory();
      } else { showToast("Error: " + (data.error || "Login fail")); }
    }

    async function handleSignup() {
      const phone = document.getElementById("authPhoneInput").value.trim();
      const password = document.getElementById("authPassInput").value.trim();
      const name = document.getElementById("authNameInput").value.trim();

      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "signup", phone, password, name })
      });
      const data = await res.json();
      if (data.ok && data.token) {
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
        showToast("Account created!");
        closeModal("profileModal");
        fetchUserCloudHistory();
      } else { showToast("Error: " + (data.error || "Signup fail")); }
    }

    function handleLogout() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      document.getElementById("navUserName").textContent = "Kisan Account";
      showToast("Signed out!");
      closeModal("profileModal");
      startNewChat();
      fetchUserCloudHistory();
    }

    async function checkAutoSession() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) return;

      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ action: "me" })
        });
        const data = await res.json();
        if (data.ok && data.user) {
          document.getElementById("navUserName").textContent = data.user.name || "Kisan Account";
          fetchUserCloudHistory();
        }
      } catch (e) {}
    }

    document.getElementById("chatInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      const savedTheme = localStorage.getItem("kisan_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      startNewChat();
      checkAutoSession();
    });
  </script>
</body>
</html>
