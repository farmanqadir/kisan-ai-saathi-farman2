<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farman Kisan Hub AI</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden antialiased">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebarBackdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-950/80 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Sidebar (Collapsible Drawer on Mobile, Fixed on Desktop) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-slate-950 flex flex-col justify-between border-r border-slate-800 shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div>
            <!-- Header & Close Button for Mobile -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-leaf text-sm"></i>
                    </div>
                    <div>
                        <span class="font-bold text-xs tracking-wide text-slate-100 block">Farman Kisan Hub</span>
                        <span class="text-[9px] text-emerald-400 font-medium tracking-wider">AI AGRICULTURE</span>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- New Chat Button -->
            <div class="p-3">
                <button onclick="startNewChat(); closeSidebarOnMobile();" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 text-xs font-medium py-2.5 px-3 rounded-xl flex items-center justify-between transition shadow-sm">
                    <span class="flex items-center space-x-2">
                        <i class="fa-solid fa-plus text-emerald-400"></i>
                        <span>New Chat</span>
                    </span>
                    <span class="text-[10px] text-slate-500 border border-slate-800 px-1.5 py-0.5 rounded hidden md:inline">Ctrl K</span>
                </button>
            </div>

            <!-- History Section -->
            <div class="px-4 pt-2 pb-1 flex items-center justify-between">
                <span class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Saved Chats</span>
                <span id="historyCount" class="text-[10px] bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800">0</span>
            </div>
            
            <!-- History List -->
            <div id="chatHistoryList" class="px-2 space-y-1 overflow-y-auto max-h-[calc(100vh-270px)] custom-scrollbar">
            </div>
        </div>

        <!-- User Profile & Auth Status -->
        <div class="p-3 bg-slate-950/90 border-t border-slate-800">
            <div id="userProfile" class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5 overflow-hidden">
                    <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl h-8 w-8 flex items-center justify-center font-semibold text-xs shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="truncate">
                        <p id="userNameDisplay" class="text-xs font-semibold text-slate-200 truncate">Guest User</p>
                        <p id="userIdDisplay" class="text-[9px] text-slate-500 truncate">ID: Not Logged In</p>
                    </div>
                </div>
                <button id="authBtn" onclick="toggleAuthModal()" class="text-[11px] bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded-lg transition font-medium shrink-0">
                    Sign In
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 min-w-0">
        
        <!-- Top Navigation Header -->
        <header class="h-14 border-b border-slate-800 px-4 md:px-6 flex items-center justify-between bg-slate-900/80 backdrop-blur-md shrink-0">
            <div class="flex items-center space-x-3">
                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-300 hover:text-white p-1.5 bg-slate-800/80 border border-slate-700 rounded-lg">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div class="flex items-center space-x-1.5">
                    <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-[9px]"></i> <span class="hidden sm:inline">Farman</span> Engine Pro
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Guest Limit Badge -->
                <div id="guestLimitBadge" class="text-[10px] bg-amber-500/10 border border-amber-500/20 text-amber-400 px-2 py-0.5 rounded flex items-center space-x-1">
                    <i class="fa-solid fa-shield-halved text-[10px]"></i>
                    <span id="guestCountText">5 Free Left</span>
                </div>
                <div class="flex items-center space-x-1">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                </div>
            </div>
        </header>

        <!-- Chat Messages Scroll Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-3 md:p-6 space-y-4 custom-scrollbar max-w-4xl mx-auto w-full">
            
            <!-- Default Landing Screen -->
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center py-8 px-4">
                <div class="w-14 h-14 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-emerald-400 mb-4 shadow-lg shadow-emerald-500/5">
                    <i class="fa-solid fa-leaf text-2xl"></i>
                </div>
                <h2 class="text-xl md:text-2xl font-bold text-slate-100 mb-1">Farman Kisan Hub AI</h2>
                <p class="text-xs text-slate-400 max-w-md mb-6">Ask any agronomic questions regarding crops, soil health, or fertilizers.</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full max-w-lg text-left">
                    <button onclick="usePrompt('What is the ideal fertilizer schedule for wheat?')" class="p-3 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 rounded-xl text-xs text-slate-300 transition group">
                        <div class="font-semibold text-slate-200 mb-0.5 group-hover:text-emerald-400">Wheat Fertilizer Advisory</div>
                        <div class="text-[10px] text-slate-500 truncate">Schedule for NPK application</div>
                    </button>
                    <button onclick="usePrompt('How to treat yellow rust in crops?')" class="p-3 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 rounded-xl text-xs text-slate-300 transition group">
                        <div class="font-semibold text-slate-200 mb-0.5 group-hover:text-emerald-400">Pest & Fungus Control</div>
                        <div class="text-[10px] text-slate-500 truncate">Fungicide & treatment guidelines</div>
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="space-y-4 hidden pb-4"></div>
        </div>

        <!-- Fixed Bottom Input Bar -->
        <div class="p-3 md:p-4 bg-slate-900 border-t border-slate-800/80 shrink-0">
            <div class="max-w-4xl mx-auto">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="relative flex items-center">
                    <input type="text" id="userInput" placeholder="Ask about agriculture..." required
                        class="w-full pl-3.5 pr-20 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500/50 text-xs md:text-sm text-slate-200 placeholder-slate-500 transition shadow-inner">
                    
                    <div class="absolute right-2 flex items-center space-x-1">
                        <button type="button" id="voiceBtn" onclick="toggleVoiceInput()" class="p-1.5 text-slate-400 hover:text-emerald-400 rounded-lg transition" title="Voice Mode">
                            <i class="fa-solid fa-microphone text-sm"></i>
                        </button>
                        <button type="submit" id="sendBtn" class="p-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl relative">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-500 hover:text-slate-300">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="flex items-center space-x-2 mb-3">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-leaf text-xs"></i>
                </div>
                <h3 class="text-sm font-bold text-slate-100">Farman Kisan Portal</h3>
            </div>

            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 mb-3">
                <button id="tabSignIn" onclick="switchAuthTab('signin')" class="flex-1 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition">Sign In</button>
                <button id="tabSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition">Sign Up</button>
            </div>

            <p class="text-[11px] text-slate-400 mb-3">Sign in to unlock unlimited AI chats and save history.</p>
            
            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="nameField" class="hidden">
                    <label class="block text-[9px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="authName" placeholder="Farman Ali" class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 text-xs focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-[9px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Gmail / Email</label>
                    <input type="email" id="authEmail" required placeholder="kisan@gmail.com" class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 text-xs focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-[9px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 text-xs focus:border-emerald-500 outline-none">
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-emerald-600/20 mt-1">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentSessionId = null;
        let allSessions = JSON.parse(localStorage.getItem('fkh_chat_sessions')) || [];
        let currentUser = JSON.parse(localStorage.getItem('fkh_user')) || null;
        let guestMessageCount = parseInt(localStorage.getItem('fkh_guest_count') || '0');
        const MAX_GUEST_LIMIT = 5;
        let authMode = 'signin';
        let isVoiceActive = false;

        window.onload = function() {
            updateUserUI();
            renderHistoryList();
        };

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth < 768) {
                toggleMobileSidebar();
            }
        }

        function updateUserUI() {
            const guestBadge = document.getElementById('guestLimitBadge');
            const guestText = document.getElementById('guestCountText');

            if (currentUser) {
                document.getElementById('userNameDisplay').innerText = currentUser.name || currentUser.email.split('@')[0];
                document.getElementById('userIdDisplay').innerText = `ID: ${currentUser.id}`;
                document.getElementById('authBtn').innerText = 'Sign Out';
                document.getElementById('authBtn').setAttribute('onclick', 'logoutUser()');
                guestBadge.classList.add('hidden');
            } else {
                document.getElementById('userNameDisplay').innerText = 'Guest User';
                document.getElementById('userIdDisplay').innerText = 'ID: Not Logged In';
                document.getElementById('authBtn').innerText = 'Sign In';
                document.getElementById('authBtn').setAttribute('onclick', 'toggleAuthModal()');
                guestBadge.classList.remove('hidden');
                const remaining = Math.max(0, MAX_GUEST_LIMIT - guestMessageCount);
                guestText.innerText = `${remaining} Free Left`;
            }
        }

        function toggleAuthModal() {
            document.getElementById('authModal').classList.toggle('hidden');
        }

        function switchAuthTab(mode) {
            authMode = mode;
            const tabSignIn = document.getElementById('tabSignIn');
            const tabSignUp = document.getElementById('tabSignUp');
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (mode === 'signup') {
                tabSignUp.className = "flex-1 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition";
                tabSignIn.className = "flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition";
                nameField.classList.remove('hidden');
                submitBtn.innerText = "Create Account";
            } else {
                tabSignIn.className = "flex-1 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition";
                tabSignUp.className = "flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition";
                nameField.classList.add('hidden');
                submitBtn.innerText = "Sign In";
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const name = document.getElementById('authName').value || email.split('@')[0];
            const userId = 'FKH-USER-' + Math.floor(100000 + Math.random() * 900000);
            
            currentUser = { name, email, id: userId };
            localStorage.setItem('fkh_user', JSON.stringify(currentUser));
            
            updateUserUI();
            toggleAuthModal();
            
            document.getElementById('userInput').disabled = false;
            document.getElementById('userInput').placeholder = "Ask about agriculture...";
        }

        function logoutUser() {
            localStorage.removeItem('fkh_user');
            currentUser = null;
            updateUserUI();
            startNewChat();
        }

        function usePrompt(text) {
            document.getElementById('userInput').value = text;
            handleSendMessage(new Event('submit'));
        }

        async function handleSendMessage(e) {
            e.preventDefault();

            if (!currentUser && guestMessageCount >= MAX_GUEST_LIMIT) {
                alert("Free limit reached! Please Sign In / Sign Up to continue chatting.");
                toggleAuthModal();
                return;
            }

            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            if (!currentUser) {
                guestMessageCount++;
                localStorage.setItem('fkh_guest_count', guestMessageCount.toString());
                updateUserUI();
            }

            document.getElementById('welcomeScreen').classList.add('hidden');
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.classList.remove('hidden');

            appendMessage(messageText, 'user');
            inputField.value = '';

            if (!currentSessionId) {
                currentSessionId = 'session_' + Date.now();
                const newSession = {
                    id: currentSessionId,
                    title: messageText.length > 25 ? messageText.substring(0, 25) + '...' : messageText,
                    timestamp: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                    messages: []
                };
                allSessions.unshift(newSession);
            }

            const session = allSessions.find(s => s.id === currentSessionId);
            session.messages.push({ role: 'user', content: messageText });
            saveSessions();

            const loadingId = showLoadingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: session.messages, isCall: isVoiceActive })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingId);

                const botReply = data.reply || "An error occurred while generating response.";
                appendMessage(botReply, 'assistant');
                
                session.messages.push({ role: 'assistant', content: botReply });
                saveSessions();

            } catch (err) {
                removeLoadingIndicator(loadingId);
                appendMessage("Failed to connect to AI server.", 'assistant');
            }

            if (!currentUser && guestMessageCount >= MAX_GUEST_LIMIT) {
                inputField.disabled = true;
                inputField.placeholder = "Free limit reached. Sign In to continue.";
                setTimeout(() => toggleAuthModal(), 1000);
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-2.5 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            messageDiv.innerHTML = `
                <div class="${isUser ? 'bg-emerald-600' : 'bg-slate-800 border border-slate-700'} text-slate-100 rounded-xl h-7 w-7 flex items-center justify-center shrink-0 text-xs font-semibold">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-leaf text-emerald-400'} text-[11px]"></i>
                </div>
                <div class="${isUser ? 'bg-emerald-600 text-white' : 'bg-slate-950 border border-slate-800 text-slate-200'} p-3 rounded-2xl shadow-sm max-w-[85%] sm:max-w-xl text-xs leading-relaxed">
                    <p class="whitespace-pre-wrap">${text}</p>
                </div>
            `;
            
            container.appendChild(messageDiv);
            const scrollContainer = document.getElementById('chatContainer');
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        function showLoadingIndicator() {
            const container = document.getElementById('chatMessages');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex items-start space-x-2.5';
            div.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 text-emerald-400 rounded-xl h-7 w-7 flex items-center justify-center shrink-0 text-xs">
                    <i class="fa-solid fa-leaf text-[11px]"></i>
                </div>
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl text-slate-400 text-xs italic flex items-center space-x-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-emerald-400"></i>
                    <span>Analyzing...</span>
                </div>
            `;
            container.appendChild(div);
            const scrollContainer = document.getElementById('chatContainer');
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function saveSessions() {
            localStorage.setItem('fkh_chat_sessions', JSON.stringify(allSessions));
            renderHistoryList();
        }

        function renderHistoryList() {
            const container = document.getElementById('chatHistoryList');
            document.getElementById('historyCount').innerText = allSessions.length;
            container.innerHTML = '';

            allSessions.forEach(session => {
                const isActive = session.id === currentSessionId;
                const div = document.createElement('div');
                div.className = `p-2 rounded-xl text-xs cursor-pointer transition flex items-center justify-between group ${isActive ? 'bg-slate-800/90 text-slate-100 border border-slate-700' : 'text-slate-400 hover:bg-slate-900/80 hover:text-slate-200 border border-transparent'}`;
                
                div.onclick = () => { loadSession(session.id); closeSidebarOnMobile(); };
                div.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-regular fa-message text-slate-500 text-[11px]"></i>
                        <span class="truncate">${session.title}</span>
                    </div>
                    <button onclick="deleteSession(event, '${session.id}')" class="opacity-100 md:opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 transition">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = allSessions.find(s => s.id === id);
            if (!session) return;

            document.getElementById('welcomeScreen').classList.add('hidden');
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            container.classList.remove('hidden');

            session.messages.forEach(msg => {
                appendMessage(msg.content, msg.role);
            });

            renderHistoryList();
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            allSessions = allSessions.filter(s => s.id !== id);
            if (currentSessionId === id) {
                startNewChat();
            } else {
                saveSessions();
            }
        }

        function startNewChat() {
            currentSessionId = null;
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatMessages').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            renderHistoryList();
        }

        function toggleVoiceInput() {
            isVoiceActive = !isVoiceActive;
            const btn = document.getElementById('voiceBtn');
            if (isVoiceActive) {
                btn.classList.add('text-emerald-400', 'animate-pulse');
            } else {
                btn.classList.remove('text-emerald-400', 'animate-pulse');
            }
        }
    </script>
</body>
</html>
