<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farman Kisan Hub – AI Agricultural Advisor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;
      --card-bg: #f1f5f9;
      --primary-accent: #15803d;
      --primary-hover: #166534;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --card-bg: #334155;
      --primary-accent: #22c55e;
      --primary-hover: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

    /* Layout & Sidebar */
    #sidebar { width: 280px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s; z-index: 100; }
    #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .chat-list { flex: 1; overflow-y: auto; padding: 12px; }
    .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .chat-item:hover { border-left: 3px solid var(--primary-accent); }

    /* Main Chat Window */
    #mainChat { flex: 1; display: flex; flex-direction: column; height: 100%; }
    .chat-header { padding: 14px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* Messages & Formatting */
    .msg-row { display: flex; gap: 12px; max-width: 85%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai { align-self: flex-start; }
    .msg-bubble { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; }
    .msg-row.user .msg-bubble { background: var(--primary-accent); color: #ffffff; border: none; }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { color: var(--primary-accent); margin: 12px 0 6px 0; font-size: 16px; }
    .msg-bubble ol, .msg-bubble ul { padding-left: 20px; margin: 8px 0; }

    /* Image Preview Container */
    .image-preview-bar { display: none; padding: 8px 16px; background: var(--card-bg); border-top: 1px solid var(--border-color); align-items: center; gap: 12px; }
    .image-preview-bar.active { display: flex; }
    .image-preview-bar img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
    .image-status-badge { font-size: 12px; color: var(--primary-accent); font-weight: 600; }

    /* Input Bar */
    .input-bar { padding: 16px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .input-controls { display: flex; gap: 10px; align-items: flex-end; }
    .chat-textarea { flex: 1; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; color: var(--text-primary); font-size: 15px; max-height: 120px; resize: none; outline: none; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); width: 42px; height: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .icon-btn.recording { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
    .send-btn { background: var(--primary-accent); color: #ffffff; border: none; padding: 0 20px; height: 42px; border-radius: 10px; font-weight: 600; cursor: pointer; }

    /* Toast Notification */
    .toast-box { position: fixed; bottom: 20px; right: 20px; background: var(--text-primary); color: var(--bg-primary); padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; display: none; }
    .toast-box.active { display: block; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>🌾 Kisan Hub</h3>
      <button class="icon-btn" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="padding: 10px 12px;">
      <button class="send-btn" style="width: 100%;" onclick="startNewChat()">+ New Chat</button>
      <input type="text" id="searchInput" placeholder="Search chats..." style="width: 100%; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline: none;" oninput="searchChats(this.value)">
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Main Chat Window -->
  <div id="mainChat">
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="icon-btn" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h2>Farman Kisan Hub AI</h2>
      </div>
      <button class="icon-btn" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i></button>
    </div>

    <!-- Chat Messages Container -->
    <div class="chat-body" id="chatContainer"></div>

    <!-- Image Upload Preview Bar -->
    <div class="image-preview-bar" id="imagePreviewBar">
      <img id="imgPreviewThumb" src="" alt="Crop Preview">
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600;">Crop Image Attached</div>
        <div class="image-status-badge" id="imageStatusBadge">Ready for analysis</div>
      </div>
      <button class="icon-btn" style="width: 32px; height: 32px;" onclick="removeSelectedImage()"><i class="bi bi-trash"></i></button>
    </div>

    <!-- Input Bar Controls -->
    <div class="input-bar">
      <div class="input-controls">
        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/jpg" style="display: none;" onchange="handleFileSelect(event)">
        
        <button class="icon-btn" title="Attach Crop Photo" onclick="document.getElementById('fileInput').click()"><i class="bi bi-paperclip"></i></button>
        <button class="icon-btn" id="micBtn" title="Voice Input" onclick="toggleVoiceInput()"><i class="bi bi-mic"></i></button>
        
        <textarea id="chatInput" class="chat-textarea" placeholder="Ask about crop diseases, fertilizers, or attach a photo..." rows="1"></textarea>
        
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <div id="toastBox" class="toast-box"></div>

  <script>
    let currentImageBase64 = null;
    let currentImageMime = null;
    let messages = [];
    let isListening = false;
    let recognition = null;

    // Toast Notification
    function showToast(text) {
      const box = document.getElementById("toastBox");
      box.textContent = text;
      box.classList.add("active");
      setTimeout(() => box.classList.remove("active"), 3500);
    }

    // Theme Toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
    }

    // Handle Image Selection & Base64 Converter
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        showToast("Error: Image size exceeds 10MB limit.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result.split(',')[1];
        currentImageMime = file.type;

        document.getElementById("imgPreviewThumb").src = e.target.result;
        document.getElementById("imageStatusBadge").textContent = "Uploaded (" + (file.size/1024).toFixed(1) + " KB)";
        document.getElementById("imagePreviewBar").classList.add("active");
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedImage() {
      currentImageBase64 = null;
      currentImageMime = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("imagePreviewBar").classList.remove("active");
    }

    // Voice-to-Text Input
    function toggleVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast("Voice input is not supported in this browser.");
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US'; 
      
      recognition.onstart = function() {
        isListening = true;
        document.getElementById("micBtn").classList.add("recording");
      };

      recognition.onresult = function(e) {
        document.getElementById("chatInput").value += " " + e.results[0][0].transcript;
      };

      recognition.onend = function() {
        isListening = false;
        document.getElementById("micBtn").classList.remove("recording");
      };

      recognition.start();
    }

    // Text-To-Speech (TTS Reader for farmers)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text.replace(/[*#]/g, ''));
        window.speechSynthesis.speak(utterance);
      }
    }

    // Format AI Response to Readable HTML Cards
    function formatMarkdown(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\- (.*$)/gim, '<li>$1</li>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    // Append Message to UI
    function appendMessage(role, text, imageSrc = null) {
      const container = document.getElementById("chatContainer");
      const row = document.createElement("div");
      row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

      let imgHTML = imageSrc ? `<img src="${imageSrc}" style="max-width:200px; border-radius:8px; margin-bottom:8px; display:block;">` : '';
      let ttsBtn = role === 'assistant' ? `<button onclick="speakText(\`${text.replace(/[`"]/g, '')}\`)" style="border:none; background:none; cursor:pointer; opacity:0.6; margin-top:6px; color:var(--text-primary);" title="Listen"><i class="bi bi-volume-up"></i> Listen</button>` : '';

      row.innerHTML = `<div class="msg-bubble">${imgHTML}${formatMarkdown(text)}${ttsBtn}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // Send Message Handler
    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text && !currentImageBase64) return;

      const userImageSrc = currentImageBase64 ? `data:${currentImageMime};base64,${currentImageBase64}` : null;
      appendMessage('user', text || "Analyzing uploaded crop photo...", userImageSrc);

      messages.push({ role: 'user', content: text || "Please analyze this attached crop image." });

      const payload = {
        messages: messages,
        image: currentImageBase64 ? { mimeType: currentImageMime, data: currentImageBase64 } : null
      };

      input.value = "";
      removeSelectedImage();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const reply = data.reply || "Unable to process request.";

        appendMessage('assistant', reply);
        messages.push({ role: 'assistant', content: reply });
      } catch (err) {
        appendMessage('assistant', "Network Error: Please check your connection.");
      }
    }

    function startNewChat() {
      messages = [];
      document.getElementById("chatContainer").innerHTML = "";
      appendMessage("assistant", "Assalam-o-Alaikum! I am Farman Kisan Hub AI. How can I assist you with your crops today?");
    }

    function searchChats(query) {
      // Sidebar chat search handler stub
    }

    // Enter Key Send (Shift+Enter for newline)
    document.getElementById("chatInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    startNewChat();
  </script>
</body>
</html>
