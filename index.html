<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farman Kisan Hub AI Assistant</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

    <!-- Sidebar: History & Profile -->
    <aside class="w-full md:w-80 bg-emerald-900 text-white flex flex-col justify-between border-r border-emerald-800 shadow-lg shrink-0">
        <div>
            <!-- Header -->
            <div class="p-4 border-b border-emerald-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-seedling text-emerald-400 text-2xl"></i>
                    <span class="font-bold text-lg">Farman Kisan Hub</span>
                </div>
            </div>

            <!-- New Chat Button -->
            <div class="p-4">
                <button onclick="startNewChat()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 transition duration-200 shadow">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nayi Guftagu (New Chat)</span>
                </button>
            </div>

            <!-- Chat History -->
            <div class="px-4 py-2 text-xs uppercase tracking-wider text-emerald-400 font-semibold">Chat History</div>
            <div id="chatHistoryList" class="px-2 space-y-1 overflow-y-auto max-h-[calc(100vh-280px)]">
                <div class="p-2 hover:bg-emerald-800 rounded-lg text-sm text-emerald-100 cursor-pointer truncate">
                    <i class="fa-regular fa-message mr-2"></i> Kheti baadi mashwara
                </div>
            </div>
        </div>

        <!-- User Profile & Login Section -->
        <div class="p-4 bg-emerald-950 border-t border-emerald-800">
            <div id="userProfile" class="flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div class="bg-emerald-700 text-white rounded-full h-10 w-10 flex items-center justify-center font-bold shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="truncate">
                        <p id="userNameDisplay" class="text-sm font-semibold truncate">Guest User</p>
                        <p id="userIdDisplay" class="text-xs text-emerald-400 truncate">ID: Not Logged In</p>
                    </div>
                </div>
                <button id="authBtn" onclick="toggleAuthModal()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition font-medium">
                    Login
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col h-full bg-white">
        <!-- Top Navigation -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
            <div>
                <h1 class="text-lg font-bold text-gray-800 flex items-center space-x-2">
                    <span class="text-emerald-700">Kisan AI Assistant</span>
                </h1>
                <p class="text-xs text-gray-500">Aapka Zira'at aur Fasal Advisor</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-xs text-gray-600 font-medium">Active</span>
            </div>
        </header>

        <!-- Messages Box -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-slate-50">
            <!-- Default Bot Welcome -->
            <div class="flex items-start space-x-3">
                <div class="bg-emerald-600 text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 max-w-xl text-gray-800 text-sm">
                    Assalam-o-Alaikum! Main Farman Kisan Hub AI Assistant hoon. Fasal, khad, zameen ya kisi bhi kheti baadi ke masle ke liye sawal pochein.
                </div>
            </div>
        </div>

        <!-- Bottom Input Area -->
        <div class="p-4 bg-white border-t border-gray-200">
            <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2 max-w-4xl mx-auto">
                <div class="relative flex-1">
                    <input type="text" id="userInput" placeholder="Apna sawal likhein..." required
                        class="w-full pl-4 pr-12 py-3 bg-gray-100 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-sm">
                    
                    <!-- Voice Assistant Icon inside Input -->
                    <button type="button" id="voiceBtn" onclick="toggleVoiceInput()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-emerald-600 p-1.5 transition" title="Voice Assistant">
                        <i class="fa-solid fa-microphone text-lg"></i>
                    </button>
                </div>

                <!-- Send Button -->
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Login / Signup Modal -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-gray-800 mb-4">Kisan Account Login</h3>
            
            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Naam (Name)</label>
                    <input type="text" id="authName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mobile / Email</label>
                    <input type="text" id="authEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-medium transition">
                    Login / Register
                </button>
            </form>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let chatHistory = [];
        let currentUser = JSON.parse(localStorage.getItem('kisan_user')) || null;
        let isVoiceActive = false;

        window.onload = function() {
            updateUserUI();
        };

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('userNameDisplay').innerText = currentUser.name;
                document.getElementById('userIdDisplay').innerText = `ID: ${currentUser.id}`;
                document.getElementById('authBtn').innerText = 'Logout';
                document.getElementById('authBtn').setAttribute('onclick', 'logoutUser()');
            } else {
                document.getElementById('userNameDisplay').innerText = 'Guest User';
                document.getElementById('userIdDisplay').innerText = 'ID: Not Logged In';
                document.getElementById('authBtn').innerText = 'Login';
                document.getElementById('authBtn').setAttribute('onclick', 'toggleAuthModal()');
            }
        }

        function toggleAuthModal() {
            document.getElementById('authModal').classList.toggle('hidden');
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('authName').value;
            const email = document.getElementById('authEmail').value;
            const userId = 'KISAN-' + Math.floor(100000 + Math.random() * 900000);
            
            currentUser = { name, email, id: userId };
            localStorage.setItem('kisan_user', JSON.stringify(currentUser));
            
            updateUserUI();
            toggleAuthModal();
        }

        function logoutUser() {
            localStorage.removeItem('kisan_user');
            currentUser = null;
            updateUserUI();
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            appendMessage(messageText, 'user');
            inputField.value = '';

            chatHistory.push({ role: 'user', content: messageText });

            const loadingId = showLoadingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, isCall: isVoiceActive })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingId);

                const botReply = data.reply || "Maazrat, jawab hasil nahi ho saka.";
                appendMessage(botReply, 'assistant');
                chatHistory.push({ role: 'assistant', content: botReply });

            } catch (err) {
                removeLoadingIndicator(loadingId);
                appendMessage("Server Error. Koshish karein ke backend `/api/chat` active ho.", 'assistant');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            messageDiv.innerHTML = `
                <div class="${isUser ? 'bg-emerald-800' : 'bg-emerald-600'} text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'} text-sm"></i>
                </div>
                <div class="${isUser ? 'bg-emerald-600 text-white' : 'bg-white text-gray-800 border border-gray-200'} p-4 rounded-2xl shadow-sm max-w-xl text-sm">
                    <p>${text}</p>
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showLoadingIndicator() {
            const container = document.getElementById('chatMessages');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex items-start space-x-3';
            div.innerHTML = `
                <div class="bg-emerald-600 text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 text-gray-500 text-sm italic">
                    Jawab soch raha hai...
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function toggleVoiceInput() {
            isVoiceActive = !isVoiceActive;
            const btn = document.getElementById('voiceBtn');
            if (isVoiceActive) {
                btn.classList.add('text-emerald-600', 'animate-pulse');
            } else {
                btn.classList.remove('text-emerald-600', 'animate-pulse');
            }
        }

        function startNewChat() {
            chatHistory = [];
            document.getElementById('chatMessages').innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="bg-emerald-600 text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 max-w-xl text-gray-800 text-sm">
                        Nayi guftagu shuru ho chuki hai. Fasal se mutaliq sawal pochin!
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
